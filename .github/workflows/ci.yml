name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jdlens
          POSTGRES_PASSWORD: jdlens
          POSTGRES_DB: jdlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jdlens -d jdlens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # API tests only; no LLM key in CI (tests use FakeLLMClient).
      TEST_DATABASE_URL: postgresql+asyncpg://jdlens:jdlens@localhost:5432/jdlens_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q
